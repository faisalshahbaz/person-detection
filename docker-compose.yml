# Local full stack:
#   cd person-detection && cp .env.example .env
#   docker compose up --build
#
# Detached: docker compose up --build -d
# One service only: docker compose up ml-service -d  (see docs/RUN_SERVICES.txt)

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
    ports:
      - "9000:9000"
    environment:
      ML_HOST: 0.0.0.0
      ML_PORT: 9000
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:-dev-ml-token}
      YOLO_MODEL: ${YOLO_MODEL:-yolov8n.pt}
      DETECTOR: ${DETECTOR:-onnx}
      ONNX_MODEL_PATH: ${ONNX_MODEL_PATH:-/app/models/yolov8n.onnx}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.25}
      IOU_THRESHOLD: ${IOU_THRESHOLD:-0.45}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:-dev-ml-token}
      ML_SERVICE_URL: http://ml-service:9000
      REDIS_URL: redis://redis:6379/0
      DEMO_USERS: ${DEMO_USERS:-admin:admin123,demo:demo123}
      UPLOAD_DIR: /tmp/uploads
    volumes:
      - backend_uploads:/tmp/uploads
    depends_on:
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
      FRAME_SAMPLE_RATE: ${FRAME_SAMPLE_RATE:-3}
      STUN_SERVER: ${STUN_SERVER:-stun:stun.l.google.com:19302}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_uploads:
